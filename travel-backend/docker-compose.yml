version: '3.9'

services:
  backend:
    build: .
    container_name: travel-backend
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: docker
    depends_on:
      - mysql
    restart: unless-stopped
    

  mysql:
    image: mysql:8.0
    container_name: travel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: travel_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: